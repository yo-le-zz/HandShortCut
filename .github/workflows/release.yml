name: Release

# Publication automatique : git tag v2.0.0 && git push origin v2.0.0
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: # test à blanc : construit tout, ne publie rien

permissions:
  contents: write

jobs:
  verify:
    name: Vérifier tag / version / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Le tag correspond à pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/release_notes.py --check-tag "$GITHUB_REF"
      - name: Notes de version présentes dans CHANGELOG.md
        run: python3 scripts/release_notes.py "$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')" > release-notes.md
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  linux:
    name: Paquets Linux (.deb, .rpm)
    needs: verify
    runs-on: ubuntu-22.04 # glibc 2.35 : compatible Debian 12+, Ubuntu 22.04+, Fedora 36+
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ hashFiles('uv.lock') }}
          restore-keys: ccache-linux-
      - name: Construction
        run: ./build.sh --deb --rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    name: Paquets Windows (.exe, .msi)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Installer Inno Setup et WiX
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 5.0.2
      - name: Construction
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: |
            dist/*.exe
            dist/*.msi
          if-no-files-found: error

  publish:
    name: Publier la release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Empreintes SHA-256
        working-directory: artifacts
        run: |
          sha256sum *.deb *.rpm *.exe *.msi > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: artifacts/release-notes.md
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.exe
            artifacts/*.msi
            artifacts/SHA256SUMS
          fail_on_unmatched_files: true
