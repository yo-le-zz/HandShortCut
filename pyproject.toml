[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "handshortcut"
version = "1.0.0"
description = "Gestes de la main via la webcam -> actions (apps, fenetres, raccourcis, URL, commandes). Linux et Windows."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "yolezz" }]
keywords = ["hand-gesture", "gesture-recognition", "mediapipe", "webcam", "automation", "shortcuts", "linux", "windows"]
# mediapipe 0.10.14 : pas de wheel pour Python 3.13+, et les versions plus
# recentes ont supprime l'API `mp.solutions` utilisee par le moteur.
requires-python = ">=3.10,<3.13"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Video :: Capture",
  "Topic :: Utilities",
]
dependencies = [
  "mediapipe==0.10.14",
  "opencv-contrib-python==4.10.0.84",
  "numpy>=1.26,<2",
  "flask>=3.0,<4",
  "waitress>=3.0,<4",
  "platformdirs>=4.2,<5",
  "screeninfo>=0.8.1,<1",
  "pyautogui>=0.9.54,<1",
  "pyperclip>=1.9,<2",
  "psutil>=6.0",
  "websocket-client>=1.7,<2",
  "plyer>=2.1,<3; sys_platform == 'win32'",
  "pygetwindow>=0.0.9; sys_platform == 'win32'",
  "pycaw>=20240210; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/yo-le-zz/HandShortCut"
Repository = "https://github.com/yo-le-zz/HandShortCut"
Issues = "https://github.com/yo-le-zz/HandShortCut/issues"
Changelog = "https://github.com/yo-le-zz/HandShortCut/blob/main/CHANGELOG.md"

[project.scripts]
handshortcut = "handshortcut.cli:main"

[project.gui-scripts]
handshortcut-gui = "handshortcut.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10.4"]
# Compilation de l'executable natif (packaging/build_exe.py)
build = ["nuitka>=2.5", "ordered-set>=4.1", "zstandard>=0.23"]

[tool.uv]
default-groups = ["dev"]
# mediapipe 0.10.14 declare jax, jaxlib et sounddevice (matplotlib reste requis), mais le code
# de HandShortCut n'utilise que `mp.solutions.hands` + `drawing_utils`.
# Un marqueur jamais vrai retire ces paquets (~300 Mo) de l'installation.
override-dependencies = [
  "jax; sys_platform == 'never'",
  "jaxlib; sys_platform == 'never'",
  "sounddevice; sys_platform == 'never'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/handshortcut"]

[tool.hatch.build.targets.sdist]
include = ["src/handshortcut", "tests", "assets", "scripts", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
